spring:
  application:
    name: rubric-service
  config:
    import: "optional:configserver:"
  cloud:
    config:
      discovery:
        enabled: true          # find config-server through Eureka
        service-id: config-server
      fail-fast: false
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/rubric-db}
    username: ${DATABASE_USERNAME:admin}
    password: ${DATABASE_PASSWORD:admin}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_SERVER_URL:http://localhost:7080/realms/assay}/protocol/openid-connect/certs

server:
  port: ${PORT:8080}
  shutdown: graceful

eureka:
  client:
    service-url:
      defaultZone: ${REGISTRY_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: ${spring.application.name}
    description: "Assay rubric service: criteria, weights and level descriptions"
    version: ${BUILD_VERSION:dev}

springdoc:
  api-docs:
    path: /v3/api-docs
