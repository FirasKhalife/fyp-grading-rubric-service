spring:
  application:
    name: rubric-service
  config:
    # Shared settings from config-server (fyp-grading-config). Optional: this file is complete on its own.
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8071}/config"
  cloud:
    config:
      fail-fast: false
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/rubric-db}
    username: ${DATABASE_USERNAME:admin}
    password: ${DATABASE_PASSWORD:admin}
    hikari:
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_SERVER_URL:http://localhost:7080/realms/assay}/protocol/openid-connect/certs

server:
  port: ${PORT:8080}
  shutdown: graceful
  tomcat:
    threads:
      max: 40   # review H5: a demo needs few threads, and each costs stack memory

eureka:
  client:
    # Register and refresh quickly: the services start together and find each other (and the config server) by name.
    initial-instance-info-replication-interval-seconds: 2
    registry-fetch-interval-seconds: 5
    service-url:
      defaultZone: ${REGISTRY_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: ${spring.application.name}
    description: "Assay rubric service: criteria, weights and level descriptions"
    version: ${BUILD_VERSION:dev}

springdoc:
  # Service-to-service endpoints aren't part of the public API (the gateway doesn't route them).
  paths-to-exclude: /internal/**
